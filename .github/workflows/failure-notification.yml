name: Workflow Failure Notification
on:
  workflow_run:
    workflows: ["Staging", "Production"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  notify-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Get PR information
        id: get-pr-info
        uses: potiuk/get-workflow-origin@v1_5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sourceRunId: ${{ github.event.workflow_run.id }}

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        if: steps.get-pr-info.outputs.pullRequestNumber != ''
        with:
          pr_number: ${{ steps.get-pr-info.outputs.pullRequestNumber }}
          comment_tag: workflow_failure
          mode: recreate
          message: |
            ❌ **${{ github.event.workflow_run.name }} workflow has failed!**

            Please check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}) for more details.
