name: "Workflow dispatch from comment"
description: "Dispatch a workflow from a comment"

inputs:
  workflow:
    description: "Workflow to dispatch"
    required: true
  github-token:
    description: "GitHub token"
    required: true

runs:
  using: composite
  steps:
    - name: React on comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ github.event.comment.id }}
        reactions: "+1"
    - name: Get branch ref
      id: "get_branch"
      shell: bash
      run: echo "branch=$(gh pr view $PR_NO --repo $REPO --json headRefName --jq '.headRefName')" >> $GITHUB_OUTPUT
      env:
        REPO: ${{ github.repository }}
        PR_NO: ${{ github.event.issue.number }}
        GH_TOKEN: ${{ inputs.github-token }}
    - name: Dispatch workflow
      shell: bash
      run: gh workflow run ${{ inputs.workflow }} --ref ${{ steps.get_branch.outputs.branch }} -f pr_number=${{ github.event.issue.number }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
