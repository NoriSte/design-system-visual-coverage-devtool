name: Build packages & cache dists
description: Build packages and cache dist folders

runs:
  using: composite
  steps:
    - name: Install dependencies
      uses: ./.github/actions/install_cached
    - name: Setup build cache
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          packages/*/dist
          support/*/dist
          themes/*/dist
          packages/**/generated
          !packages/*/node_modules
          support/**/generated
          !support/*/node_modules
          themes/**/generated
          !themes/*/node_modules
        key: build-${{ runner.os }}-${{ github.sha }}
    - name: Build packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn build
